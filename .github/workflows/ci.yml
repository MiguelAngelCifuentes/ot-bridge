name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    name: Tests · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, historian, alarm-engine, digital-twin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: it/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1
        working-directory: it/${{ matrix.service }}
      - run: python -m pytest -q tests
        working-directory: it/${{ matrix.service }}

  plant-api:
    name: Tests · plant-api (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
        working-directory: it/api

  scada-hmi:
    name: Build y validación del SCADA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python ot/scada/hmi/generator/build.py --target plant
      - run: python ot/scada/hmi/generator/build.py --target sandbox

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --select E9,F63,F7,F82,F401,F841 --target-version py311 .

  compose:
    name: Validación de Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capa OT
        run: docker compose -f ot/scada/docker-compose.yml --profile two-host config -q
      - name: Capa IT (dos hosts y un solo host)
        working-directory: it
        run: |
          docker network create otb-ot
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.single-host.yml config -q

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks sobre todo el historial
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --verbose

  iac:
    name: Análisis de configuración (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  e2e:
    name: Instalación completa desde cero (otb.py)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Instalar y verificar la plataforma (13 servicios, PLC, SCADA y prueba E2E)
        run: python otb.py install
      - name: Estado final
        if: always()
        run: python otb.py status
      - name: Diagnóstico
        if: failure()
        run: |
          docker ps -a --filter name=otb-
          tail -n 150 .otb/*.log
          for c in otb-openplc otb-fuxa otb-field-simulator otb-gateway; do echo "== $c"; docker logs --tail 40 "$c" || true; done
      - name: Desinstalación completa (contenedores, datos, imágenes y ficheros)
        if: always()
        run: |
          python otb.py uninstall --all --yes
          test -z "$(docker ps -aq --filter name=otb-)" && test ! -e it/.env && test ! -d .otb
