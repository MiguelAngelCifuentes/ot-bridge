name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    name: Tests · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, historian, alarm-engine, digital-twin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: it/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1
        working-directory: it/${{ matrix.service }}
      - run: python -m pytest -q tests
        working-directory: it/${{ matrix.service }}

  plant-api:
    name: Tests · plant-api (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp verify
        working-directory: it/api

  scada-hmi:
    name: Build y validación del SCADA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python ot/scada/hmi/generator/build.py --target plant
      - run: python ot/scada/hmi/generator/build.py --target sandbox

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --select E9,F63,F7,F82,F401,F841 --target-version py311 .

  compose:
    name: Validación de Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Capa OT
        run: docker compose -f ot/scada/docker-compose.yml --profile two-host config -q
      - name: Capa IT (dos hosts y un solo host)
        working-directory: it
        run: |
          docker network create fuxa_default
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.single-host.yml config -q

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks sobre todo el historial
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact --verbose

  iac:
    name: Análisis de configuración (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
