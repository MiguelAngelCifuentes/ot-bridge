# OT-Bridge · capa OT: simulador de planta (L0), PLC OpenPLC Runtime v4 (L1) y SCADA FUXA (L2).
#
#   docker compose -f ot/scada/docker-compose.yml up -d                       # un solo host (lo hace otb.py)
#   docker compose -f ot/scada/docker-compose.yml --profile two-host up -d    # OT/IT en hosts separados
#
# Solo se publican en el host la web de FUXA y la API del runtime, y por defecto solo en loopback.
# Los puertos Modbus del simulador (:5020-5022) y del PLC (:502) quedan dentro de la red OT.
name: otb-ot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  field-simulator:
    build: ../field
    image: otb/field-simulator:local
    container_name: otb-field-simulator
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; [socket.create_connection(('127.0.0.1', p), 2).close() for p in (5020, 5021, 5022)]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *logging

  openplc-runtime:
    image: ghcr.io/autonomy-logic/openplc-runtime@sha256:1650a50d1a3e9c75cdd548c06866fc328aac1268af9b83c0313a4ab96500325d   # v4.1.10
    container_name: otb-openplc
    # El runtime pasa a RUN al arrancar si encuentra un programa compilado. Se borra en cada arranque para
    # que solo un despliegue explicito (otb.py o Build en OpenPLC Editor) ponga el PLC en marcha.
    command: ["bash", "-c", "rm -f /workdir/build/libplc_*.so && exec bash ./start_openplc.sh"]
    cap_add: [SYS_NICE, SYS_RESOURCE]       # planificacion en tiempo real del ciclo de scan
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8443:8443"               # API del runtime: solo otb.py y el Editor locales
    volumes:
      - openplc-data:/var/run/runtime       # usuarios y configuracion del runtime
    depends_on:
      field-simulator: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging

  fuxa:
    image: frangoteam/fuxa@sha256:ec90e4fce7a60ededc292e508a0461624b1be189876665d5703fe1a1af7f7677   # 1.3.4
    container_name: otb-fuxa
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FUXA_BIND:-127.0.0.1}:1881:1881"
    volumes:
      - fuxa-appdata:/usr/src/app/FUXA/server/_appdata   # proyecto, usuarios y secreto JWT
      - fuxa-db:/usr/src/app/FUXA/server/_db             # historico DAQ
      - fuxa-logs:/usr/src/app/FUXA/server/_logs
      - fuxa-pkg:/usr/src/app/FUXA/server/_pkg           # plugins (modbus-serial)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1881/api/settings', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # Solo con OT e IT en hosts distintos: expone el esclavo Modbus del PLC (:502) al gateway del host IT.
  # Modbus TCP no tiene autenticacion: el firewall del host OT solo admite el origen del host IT.
  modbus-proxy:
    profiles: [two-host]
    image: alpine/socat@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
    container_name: otb-modbus-proxy
    command: ["TCP-LISTEN:502,fork,reuseaddr", "TCP:openplc-runtime:502"]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${MODBUS_BIND:-127.0.0.1}:502:502"
    depends_on: [openplc-runtime]
    restart: unless-stopped
    logging: *logging

networks:
  default:
    name: otb-ot              # red de la zona OT; en un solo host el stack IT se une a ella

volumes:
  openplc-data:
  fuxa-appdata:
  fuxa-db:
  fuxa-logs:
  fuxa-pkg:
