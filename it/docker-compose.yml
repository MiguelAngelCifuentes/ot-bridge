# OT-Bridge · capa IT (10 servicios). Secretos en .env (plantilla: .env.example; faltantes: scripts/ensure_secrets.py).

# Bloques comunes
x-logging: &logging              # rotacion: sin esto los logs de Docker crecen sin limite
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging: *logging
  networks:
    - plant-net

x-heartbeat: &heartbeat          # servicios Python: el proceso toca /tmp/heartbeat en su bucle principal
  test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/heartbeat') < 90 else 1)"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  mosquitto:
    <<: *hardening
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mosquitto
    ports:
      - "127.0.0.1:1883:1883"
      - "${MQTT_LAN_BIND:?definir MQTT_LAN_BIND en .env}:1883:1883"   # SCADA FUXA del host OT (firewall: solo ese origen)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
    cap_add: [SETUID, SETGID, CHOWN]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1883"]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  influxdb:
    <<: *hardening
    image: influxdb:1.8.10
    container_name: influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
      INFLUXDB_DB: ${INFLUX_DB:-plant}
      INFLUXDB_ADMIN_USER: ${INFLUX_ADMIN_USER}
      INFLUXDB_ADMIN_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      INFLUXDB_WRITE_USER: ${INFLUX_WRITE_USER}
      INFLUXDB_WRITE_USER_PASSWORD: ${INFLUX_WRITE_PASSWORD}
      INFLUXDB_READ_USER: ${INFLUX_READ_USER}
      INFLUXDB_READ_USER_PASSWORD: ${INFLUX_READ_PASSWORD}
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/init:/docker-entrypoint-initdb.d
    # influxd corre como root y un volumen nuevo es del usuario 999 (755): sin DAC_OVERRIDE/FOWNER no puede
    # escribir en el y entra en bucle ("mkdir /var/lib/influxdb/meta: permission denied")
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 1g

  historian:
    <<: *hardening
    build: ./historian
    container_name: historian
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER_HISTORIAN}
      MQTT_PASS: ${MQTT_PASSWORD_HISTORIAN}
      INFLUX_HOST: influxdb
      INFLUX_PORT: "8086"
      INFLUX_DB: ${INFLUX_DB:-plant}
      INFLUX_USER: ${INFLUX_WRITE_USER}
      INFLUX_PASSWORD: ${INFLUX_WRITE_PASSWORD}
    depends_on:
      mosquitto: {condition: service_healthy}
      influxdb: {condition: service_healthy}
    healthcheck: *heartbeat
    mem_limit: 256m

  grafana:
    <<: *hardening
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      # Fijada: Infinity 4.x exige Grafana >= 11.6.11 (falla con react/jsx-runtime en 11.4)
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource 3.7.1
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/otb-home.json
      # Credenciales de solo lectura para los datasources provisionados
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${GRAFANA_DB_USER}
      PG_PASSWORD: ${GRAFANA_DB_PASSWORD}
      INFLUX_READ_USER: ${INFLUX_READ_USER}
      INFLUX_READ_PASSWORD: ${INFLUX_READ_PASSWORD}
      API_KEY_GRAFANA: ${API_KEY_GRAFANA}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    cap_add: [SETUID, SETGID]
    depends_on:
      influxdb: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 512m

  postgres:
    <<: *hardening
    image: postgres:16.13
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  plant-api:
    <<: *hardening
    build: ./api
    container_name: plant-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_USER: ${MQTT_USER_API}
      MQTT_PASS: ${MQTT_PASSWORD_API}
      INFLUX_URL: http://influxdb:8086
      INFLUX_USER: ${INFLUX_READ_USER}
      INFLUX_PASSWORD: ${INFLUX_READ_PASSWORD}
      API_KEY_GRAFANA: ${API_KEY_GRAFANA}
      API_KEY_ALARM_ENGINE: ${API_KEY_ALARM_ENGINE}
      API_KEY_OPERATOR: ${API_KEY_OPERATOR}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    depends_on:
      postgres: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
      influxdb: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 768m

  alarm-engine:
    <<: *hardening
    build: ./alarm-engine
    container_name: alarm-engine
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER_ALARM}
      MQTT_PASS: ${MQTT_PASSWORD_ALARM}
      API_URL: http://plant-api:8080
      API_KEY: ${API_KEY_ALARM_ENGINE}
      API_POLL_INTERVAL_S: "30"
      STATE_FILE: /app/data/alarm_state.json
    volumes:
      - alarm-engine-data:/app/data
    depends_on:
      mosquitto: {condition: service_healthy}
      plant-api: {condition: service_healthy}
    healthcheck: *heartbeat
    mem_limit: 128m

  gateway:
    <<: *hardening
    build: ./gateway
    container_name: gateway
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER_GATEWAY}
      MQTT_PASS: ${MQTT_PASSWORD_GATEWAY}
      PLC_HOST: ${PLC_HOST}
      PLC_PORT: ${PLC_PORT:-502}
      PLC_UNIT_ID: ${PLC_UNIT_ID:-1}
    depends_on:
      mosquitto: {condition: service_healthy}
    healthcheck: *heartbeat
    mem_limit: 128m

  opcua-server:
    <<: *hardening
    build: ./opcua-server
    container_name: opcua-server
    ports:
      - "127.0.0.1:4840:4840"
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER_OPCUA}
      MQTT_PASS: ${MQTT_PASSWORD_OPCUA}
      OPC_ENDPOINT: 0.0.0.0
      OPC_PORT: "4840"
      OPC_USER: ${OPC_USER}
      OPC_PASSWORD: ${OPC_PASSWORD}
    volumes:
      - opcua-pki:/app/pki          # certificado del servidor persistente (los clientes lo confian una vez)
    depends_on:
      mosquitto: {condition: service_healthy}
    healthcheck: *heartbeat
    mem_limit: 256m

  digital-twin:
    <<: *hardening
    build: ./digital-twin
    container_name: digital-twin
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: ${MQTT_USER_TWIN}
      MQTT_PASS: ${MQTT_PASSWORD_TWIN}
      UMBRAL_L: "20"
      TWIN_GAIN: "0.005"
      FLOW_DIVISOR: "10"            # caudales del contrato en l/min x10
    depends_on:
      mosquitto: {condition: service_healthy}
    healthcheck: *heartbeat
    mem_limit: 128m

networks:
  plant-net:
    name: plant-net

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
  postgres-data:
  alarm-engine-data:
  opcua-pki:
