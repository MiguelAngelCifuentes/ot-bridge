spring.application.name=plant-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/plant}
spring.datasource.username=${DB_USERNAME:plant}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false

mqtt.broker=${MQTT_BROKER:tcp://127.0.0.1:1883}
mqtt.client-id=${MQTT_CLIENT_ID:plant-api}
mqtt.user=${MQTT_USER:}
mqtt.pass=${MQTT_PASS:}

# Historian (solo lectura)
influx.url=${INFLUX_URL:http://127.0.0.1:8086}
influx.database=${INFLUX_DB:plant}
influx.user=${INFLUX_USER:}
influx.password=${INFLUX_PASSWORD:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Autenticacion por API key (ApiKeyFilter): claves de lectura separadas por comas y clave de operacion
api.security.enabled=${API_AUTH_ENABLED:true}
api.keys.read=${API_KEY_GRAFANA:},${API_KEY_ALARM_ENGINE:}
api.keys.operator=${API_KEY_OPERATOR:}

# Score de mantenimiento predictivo (MaintenanceServiceImpl)
maintenance.availability-min=95
maintenance.speed-min=40
maintenance.loss-max-lpm=3
maintenance.ma-min=3.5
maintenance.ma-max=20.5
maintenance.cache-seconds=15

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Documentacion OpenAPI solo en el perfil dev (application-dev.properties)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
